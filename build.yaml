# Keeps build_runner (riverpod_generator) from regenerating — and, with
# --delete-conflicting-outputs, deleting — the committed Isar schema files.
#
# The Isar generator (isar_community_generator) cannot be included in this
# project's dev_dependencies: 3.2.x is broken on the current Dart SDK and 3.3.x
# clashes with riverpod_generator 2.x. The *.g.dart under lib/core/models/ were
# generated by isar_generator 3.1.0 and remain ABI-compatible with the
# isar_community 3.2.1 runtime, so we simply preserve them and exclude their
# source models from the build so no builder treats their .g.dart as orphaned.
targets:
  $default:
    sources:
      exclude:
        - lib/core/models/**
